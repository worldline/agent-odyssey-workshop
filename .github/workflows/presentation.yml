name: Presentation only — GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python3 tooling/check_notebooks.py
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
      - name: Enforce presentation-only deployment
        run: |
          test -f build/pages/index.html
          test -f build/pages/agent-odyssey.pdf
          test "$(find build/pages -type f | wc -l)" -eq 2
          test "$(find build/pages -mindepth 1 -type d | wc -l)" -eq 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: presentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
