<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 350" data-native-chat role="img" aria-labelledby="chat-ui-title chat-ui-desc">
  <title id="chat-ui-title">A conceptual LLM chat interface</title>
  <desc id="chat-ui-desc">Arrows identify sessions, model selection, reply, prompt, files or context, and send. This is an illustration, not a live chat.</desc>
  <defs><marker id="chat-ui-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ffd18b"/></marker></defs>
  <g transform="translate(-70 -20)">
  <rect x="90" y="62" width="435" height="270" rx="14" fill="#0b2032" stroke="#557990" stroke-width="2"/>
  <path d="M200 63V331M201 108H524" stroke="#557990" stroke-width="1.5"/>
  <rect x="102" y="102" width="86" height="34" rx="6" fill="#174353" stroke="#83f0f4"/>
  <text x="114" y="125" fill="#f4f9ff" font-family="system-ui,sans-serif" font-size="20">Chat A</text>
  <rect x="102" y="153" width="86" height="34" rx="6" fill="none" stroke="#557990"/>
  <text x="114" y="176" fill="#a9bccd" font-family="system-ui,sans-serif" font-size="20">Chat B</text>
  <rect x="235" y="72" width="220" height="28" rx="6" fill="#102c41" stroke="#83f0f4"/>
  <text x="248" y="94" fill="#f4f9ff" font-family="system-ui,sans-serif" font-size="24">Example LLM</text>
  <path d="M432 80l6 8 6-8" fill="none" stroke="#83f0f4" stroke-width="2"/>
  <g data-chat-user-bubble>
  <rect x="215" y="128" width="252" height="58" rx="8" fill="#18364b"/>
  <text x="227" y="149" fill="#a9bccd" font-family="system-ui,sans-serif" font-size="18">You</text>
  <text x="227" y="177" fill="#f4f9ff" font-family="system-ui,sans-serif" font-size="24" data-chat-user-text>Fix my bug.</text>
  </g>
  <g data-chat-assistant-bubble>
  <rect x="238" y="193" width="270" height="80" rx="8" fill="#123e49"/>
  <text x="250" y="211" fill="#a9bccd" font-family="system-ui,sans-serif" font-size="18">Assistant</text>
  <text fill="#83f0f4" font-family="system-ui,sans-serif" font-size="24" data-chat-reply-text><tspan x="250" y="238" data-chat-reply-first>It claims to be</tspan><tspan x="250" y="264" data-chat-reply-second>a feature.</tspan></text>
  </g>
  <rect x="212" y="281" width="260" height="36" rx="7" fill="#06111e" stroke="#83f0f4"/>
  <path d="M229 292l-6 8a4 4 0 0 0 6 5l8-10a3 3 0 0 0-4-4l-7 9" fill="none" stroke="#c7d9e8" stroke-width="2"/>
  <text x="249" y="304" fill="#a9bccd" font-family="system-ui,sans-serif" font-size="18" data-chat-prompt-text>Describe your task…</text>
  <rect x="481" y="281" width="33" height="36" rx="7" fill="#83f0f4" data-chat-send/>
  <path d="M489 303l8-9 8 9m-8-9v15" fill="none" stroke="#06111e" stroke-width="2"/>
  </g>
  <g fill="#f4f9ff" font-family="system-ui,sans-serif" font-size="24" font-weight="600">
    <text x="20" y="22">Sessions</text>
    <text x="190" y="22">Model selection</text>
    <text x="467" y="171">Reply</text>
    <text x="275" y="339">Prompt</text>
    <text x="462" y="306">Send</text>
    <text x="20" y="339">Files / context</text>
  </g>
  <g fill="none" stroke="#ffd18b" stroke-width="2" marker-end="url(#chat-ui-arrow)">
    <path d="M80 26L82 79"/>
    <path d="M307 26L308 49"/>
    <path d="M465 175L440 198"/>
    <path d="M300 316V299"/>
    <path d="M460 292L445 283"/>
    <path d="M153 316L159 300"/>
  </g>
</svg>
