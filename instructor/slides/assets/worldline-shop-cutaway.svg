<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Odyssey, Worldline’s rocket, with its onboard North Star Supply shop exposed</title>
  <desc id="desc">A playful cutaway of a Worldline-labelled spacecraft. Inside, a shopkeeper stands behind a payment counter while two travellers browse and pay. This is an original fictional illustration, not an official Worldline logo.</desc>
  <defs>
    <linearGradient id="hull" x2="0" y2="1"><stop stop-color="#edf7ff"/><stop offset=".5" stop-color="#aec7dc"/><stop offset="1" stop-color="#5d819e"/></linearGradient>
    <linearGradient id="nose"><stop stop-color="#6d9eae"/><stop offset="1" stop-color="#153952"/></linearGradient>
    <linearGradient id="room" x2="0" y2="1"><stop stop-color="#fff4df"/><stop offset="1" stop-color="#f4d5b0"/></linearGradient>
    <linearGradient id="flame"><stop stop-color="#ffcc85" stop-opacity="0"/><stop offset="1" stop-color="#ffd09b"/></linearGradient>
    <pattern id="floor" width="44" height="24" patternUnits="userSpaceOnUse"><path d="M0 24H44M0 0V24" fill="none" stroke="#bf9b80" stroke-width="1"/></pattern>
  </defs>
  <!-- Space is a visual setting only. -->
  <g fill="#bceaff"><circle cx="190" cy="78" r="3"/><circle cx="1030" cy="72" r="3"/><circle cx="1144" cy="594" r="3"/><circle cx="347" cy="621" r="2"/><circle cx="750" cy="71" r="2"/></g>
  <g stroke="#bceaff" stroke-width="2"><path d="M100 137v16m-8-8h16M1178 92v20m-10-10h20M675 620v18m-9-9h18"/></g>
  <ellipse cx="680" cy="603" rx="460" ry="24" fill="#020b18" opacity=".4"/>
  <!-- Tail, fins and hull, seen side-on. -->
  <path d="M220 250L118 102 294 144 362 255M220 465L123 592 295 558 365 471" fill="#9b9cc8" stroke="#283b61" stroke-width="7" stroke-linejoin="round"/>
  <path d="M39 316Q111 351 168 331V419Q91 398 24 432L72 368Z" fill="url(#flame)"/>
  <path d="M150 280H235V470H150Q126 375 150 280" fill="#243c57" stroke="#0e2139" stroke-width="7"/>
  <path d="M172 300V451M194 292V460" stroke="#789ab2" stroke-width="7"/>
  <path d="M277 131H927Q1081 133 1228 373Q1085 586 927 586H277Q224 544 224 487V234Q224 174 277 131Z" fill="url(#hull)" stroke="#284764" stroke-width="7"/>
  <path d="M994 160Q1126 208 1228 373Q1119 544 996 565L1028 481V245Z" fill="url(#nose)" stroke="#284764" stroke-width="5"/>
  <path d="M1053 264Q1116 291 1155 348L1070 350Z" fill="#94e3e3" stroke="#1c4158" stroke-width="6"/>
  <path d="M1065 285L1112 312" stroke="#edffff" stroke-width="9" stroke-linecap="round" opacity=".65"/>
  <text x="309" y="197" fill="#173c53" font-family="system-ui, sans-serif" font-weight="800" font-size="49" letter-spacing="-1">Worldline</text>
  <text x="592" y="197" fill="#173c53" font-family="system-ui, sans-serif" font-size="28" font-weight="600">ODYSSEY</text>
  <g fill="#436c89"><circle cx="777" cy="183" r="15"/><circle cx="828" cy="183" r="15"/><circle cx="879" cy="183" r="15"/></g>
  <path d="M299 217H977" stroke="#638aa3" stroke-width="3" stroke-dasharray="9 8"/>
  <!-- Cutaway: the warm shop is visibly inside the cool outer hull. -->
  <rect x="284" y="238" width="714" height="292" rx="19" fill="url(#room)" stroke="#27435a" stroke-width="8"/>
  <path d="M291 481H991V515Q991 525 980 525H300Q291 525 291 515Z" fill="#d5b493"/>
  <path d="M291 481H991V515Q991 525 980 525H300Q291 525 291 515Z" fill="url(#floor)"/>
  <rect x="534" y="252" width="415" height="51" rx="8" fill="#174b56"/>
  <text x="741" y="288" text-anchor="middle" fill="#eafff4" font-family="system-ui, sans-serif" font-size="30" font-weight="750">NORTH STAR SUPPLY</text>
  <!-- Shelves: mugs, patches and snacks, not extra application features. -->
  <rect x="318" y="274" width="175" height="190" rx="6" fill="#b28569"/>
  <rect x="329" y="284" width="153" height="168" fill="#edcfad"/>
  <g stroke="#775b4d" stroke-width="8"><path d="M323 344H488M323 404H488M323 456H488"/></g>
  <g fill="#3f808d" stroke="#265261" stroke-width="3"><path d="M343 310h25v30h-25zM411 310h25v30h-25z"/><path d="M368 314h10v15h-10M436 314h10v15h-10" fill="none"/></g>
  <g fill="#ffbd64" stroke="#8e663d" stroke-width="2"><rect x="340" y="360" width="31" height="36" rx="4"/><rect x="381" y="355" width="29" height="41" rx="4"/><rect x="422" y="360" width="35" height="36" rx="4"/></g>
  <g fill="#eaf9ff" stroke="#6c8c97" stroke-width="2"><path d="M342 423l15-9 16 9-4 22h-24zM401 423l15-9 16 9-4 22h-24z"/></g>
