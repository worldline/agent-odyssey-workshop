  <rect x="626" y="434" width="204" height="84" rx="5" fill="#286579" stroke="#173e51" stroke-width="5"/>
  <rect x="612" y="423" width="232" height="18" rx="6" fill="#ddb992" stroke="#8a674d" stroke-width="4"/>
  <path d="M730 421l11-47h37l9 47Z" fill="#253c55" stroke="#11243d" stroke-width="4"/>
  <rect x="744" y="383" width="28" height="20" rx="3" fill="#9fe5d7"/>
  <g fill="#f0f5f5"><circle cx="747" cy="411" r="2"/><circle cx="756" cy="411" r="2"/><circle cx="765" cy="411" r="2"/></g>
  <circle cx="726" cy="476" r="22" fill="#70bdbf"/>
  <path d="M726 460l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1Z" fill="#e4ffff"/>
  <!-- Traveller paying: relaxed posture, card held toward the terminal. -->
  <ellipse cx="906" cy="517" rx="35" ry="8" fill="#775a4a" opacity=".25"/>
  <path d="M893 458L889 508M916 458L924 508" stroke="#263f52" stroke-width="20" stroke-linecap="round"/>
  <path d="M880 409Q905 387 930 409L937 466H876Z" fill="#e3a056" stroke="#8e643e" stroke-width="4"/>
  <path d="M884 415L851 421 817 405" fill="none" stroke="#e3a056" stroke-width="16" stroke-linecap="round"/>
  <path d="M929 420L946 446" fill="none" stroke="#e3a056" stroke-width="16" stroke-linecap="round"/>
  <path d="M903 391V405" stroke="#b77957" stroke-width="14"/>
  <ellipse cx="905" cy="371" rx="23" ry="27" fill="#bc8464"/>
  <path d="M882 369Q879 338 907 342Q933 341 928 370L918 355 888 357Z" fill="#353236"/>
  <path d="M889 381q7 5 12 0" stroke="#724636" stroke-width="2" fill="none"/>
  <rect x="790" y="388" width="33" height="20" rx="3" fill="#c7edff" stroke="#37617e" stroke-width="2" transform="rotate(13 806 398)"/>
  <!-- Lower hull lip emphasizes the open section. -->
  <path d="M282 547H988" stroke="#2e566f" stroke-width="7"/>
  <path d="M322 564H551M716 564H947" stroke="#b9d7e8" stroke-width="5" stroke-linecap="round"/>
</svg>
