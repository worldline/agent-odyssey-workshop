  <path d="M521 408Q547 386 573 408L575 460H519Z" fill="#9189c0" stroke="#423f68" stroke-width="4"/>
  <path d="M527 415L501 436 484 423M567 416L586 434" fill="none" stroke="#9189c0" stroke-width="16" stroke-linecap="round"/>
  <path d="M543 390V404" stroke="#d79771" stroke-width="14"/>
  <ellipse cx="547" cy="370" rx="23" ry="27" fill="#dda17e"/>
  <path d="M525 368Q520 337 549 342Q575 345 570 368L558 354 531 358Z" fill="#44363a"/>
  <path d="M552 379q7 5 11-1" fill="none" stroke="#734738" stroke-width="2"/>
  <!-- Shopkeeper behind the counter. -->
  <path d="M672 363V380" stroke="#8c5944" stroke-width="15"/>
  <ellipse cx="677" cy="341" rx="23" ry="27" fill="#a46e54"/>
  <path d="M654 339Q651 309 677 312Q704 311 701 339L690 325 660 327Z" fill="#24383a"/>
  <path d="M680 351q8 5 13-2" stroke="#56392f" stroke-width="2" fill="none"/>
  <path d="M654 386Q678 365 704 386L710 438H649Z" fill="#4a9394" stroke="#285f6a" stroke-width="4"/>
  <path d="M698 392L726 412 752 404" fill="none" stroke="#4a9394" stroke-width="15" stroke-linecap="round"/>
  <rect x="661" y="397" width="28" height="16" rx="3" fill="#f7e8bd"/>
