  <title id="agent-anatomy-title">Anatomy of a tool-using AI agent</title>
  <desc id="agent-anatomy-desc">A robot with a brain in a glass jar: the LLM selects actions, tools act, a runtime manages the feedback loop, and current context holds messages and results. Persistent memory and retrieval are optional attachments.</desc>
